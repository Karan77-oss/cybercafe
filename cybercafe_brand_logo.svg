<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <style>
      .bg { fill: #e8771b; }
      .cart-part { fill: #ffffff; }
      .brand-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      .brand-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 26px;
        fill: #ffffff;
        letter-spacing: 12px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" rx="32"/>

  <!-- Shopping Cart Icon Group -->
  <g transform="translate(130, 45)">
    <!-- Cart Frame and Handle -->
    <path class="cart-part" d="
      M 32 30
      h 35
      c 16 0 28 10 32 25
      l 42 165
      h 240
      c 14 0 25 11 25 25
      s -11 25 -25 25
      H 130
      c -18 0 -33 -13 -36 -31
      L 58 75
      H 32
      c -14 0 -25 -11 -25 -25
      s 11 -20 25 -20
      z
    "/>

    <!-- Middle Slat -->
    <rect class="cart-part" x="155" y="115" width="265" height="42" rx="21"/>

    <!-- Top Slat -->
    <rect class="cart-part" x="135" y="35" width="310" height="42" rx="21"/>

    <!-- Wheels -->
    <circle class="cart-part" cx="195" cy="330" r="34"/>
    <circle class="cart-part" cx="370" cy="330" r="34"/>
  </g>

  <!-- Wordmark -->
  <text class="brand-title" x="400" y="535" text-anchor="middle">CYBERCAFE</text>
  <text class="brand-sub" x="406" y="590" text-anchor="middle">SINCE 2026</text>
</svg>
